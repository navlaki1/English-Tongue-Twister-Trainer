<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tongue Twister Trainer</title>
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f8fdf8;
    color: #333;
    text-align: center;
    margin: 20px;
}
h1 { color: #2a6b2a; }
select, button {
    margin: 8px;
    padding: 8px 12px;
    font-size: 16px;
}
#twister {
    font-size: 22px;
    margin: 20px 0;
    font-weight: bold;
    color: #1b4d1b;
}
#feedback {
    font-size: 18px;
    margin: 15px;
}
#message {
    color: #0b570b;
    font-weight: bold;
    font-size: 20px;
}
#history {
    margin-top: 20px;
    font-size: 16px;
    color: #555;
}
.speed-good { color: green; font-weight: bold; }
.speed-ok { color: orange; font-weight: bold; }
.speed-bad { color: red; font-weight: bold; }
button { cursor: pointer; }
</style>
</head>
<body>

<h1>🎙️ English Tongue Twister Trainer</h1>

<div>
    <label>Choose Theme:</label>
    <select id="themeSelect">
        <option value="">-- Select Theme --</option>
        <option value="food">🍎 Food</option>
        <option value="travel">🚗 Transport / Travel</option>
        <option value="people">🧍‍♂️ People / Daily Life</option>
        <option value="home">🏠 Home / Objects</option>
    </select>
</div>

<div>
    <label>Type:</label>
    <select id="typeSelect">
        <option value="">-- Select Type --</option>
        <option value="consonant">Consonant Contrasts</option>
        <option value="vowel">Vowel Contrasts</option>
    </select>
</div>

<p id="twister">Select a theme and type to begin!</p>
<p id="message">🎧 <b style="color:darkgreen;">Speak clearly and try to match the rhythm!</b></p>

<button id="startBtn">🎤 Speak</button>
<button id="nextBtn">➡️ Next</button>

<p id="feedback"></p>
<div id="history"></div>

<script>
const tongueTwisters = {
    food: {
        consonant: [
            "Betty bought a bit of better butter.",
            "Tom tastes ten delicious donuts.",
            "Five fine fruits for very funny friends.",
            "Greedy goats gobbled green grapes."
        ],
        vowel: [
            "Eat sweet peach pits quickly.",
            "A fat man must munch much jam.",
            "Cool cooks put soup in good bowls."
        ]
    },
    travel: {
        consonant: [
            "Ten tiny trains drove down the track.",
            "Quick cars go great distances.",
            "She sells shiny ship sails.",
            "Ralph rolled along little lanes."
        ],
        vowel: [
            "The plane flies high in the sky.",
            "The ship set sail at six.",
            "The bus passed the large park."
        ]
    },
    people: {
        consonant: [
            "Larry rarely really likes red lilies.",
            "Many nice men made nine names.",
            "Tina told Dan to tidy the desk.",
            "Very few families find free food."
        ],
        vowel: [
            "Sit and see the city’s sheep.",
            "That bad man met ten men.",
            "I like loud, bright lights."
        ]
    },
    home: {
        consonant: [
            "Polly bought pretty blue plates.",
            "Tim took two clean cups.",
            "She stacks six shiny spoons.",
            "Nina lent nine little lamps."
        ],
        vowel: [
            "Fill every bin with red pens.",
            "Kate’s white tile shines bright.",
            "Luke looked for the blue book."
        ]
    }
};

let currentTheme = "";
let currentType = "";
let currentTwister = "";
let startTime;
let history = {};

function getRandomTwister() {
    const list = tongueTwisters[currentTheme][currentType];
    return list[Math.floor(Math.random() * list.length)];
}

document.getElementById("themeSelect").addEventListener("change", (e) => {
    currentTheme = e.target.value;
    document.getElementById("twister").textContent = "Select type to begin!";
    document.getElementById("feedback").textContent = "";
    document.getElementById("history").innerHTML = "";
    history = {}; // сброс истории при смене темы
});

document.getElementById("typeSelect").addEventListener("change", (e) => {
    currentType = e.target.value;
    if (currentTheme && currentType) {
        currentTwister = getRandomTwister();
        document.getElementById("twister").textContent = currentTwister;
        document.getElementById("feedback").textContent = "";
        document.getElementById("history").innerHTML = "";
        history = {};
    }
});

document.getElementById("nextBtn").addEventListener("click", () => {
    if (!currentTheme || !currentType) return;
    currentTwister = getRandomTwister();
    document.getElementById("twister").textContent = currentTwister;
    document.getElementById("feedback").textContent = "";
});

const startBtn = document.getElementById("startBtn");

if ("webkitSpeechRecognition" in window) {
    const recognition = new webkitSpeechRecognition();
    recognition.lang = "en-US";
    recognition.continuous = false;

    startBtn.onclick = () => {
        recognition.start();
        startTime = new Date().getTime();
        document.getElementById("feedback").textContent = "🎙️ Listening...";
    };

    recognition.onresult = (event) => {
        const endTime = new Date().getTime();
        const duration = (endTime - startTime) / 1000;
        const transcript = event.results[0][0].transcript.toLowerCase();
        const target = currentTwister.toLowerCase();

        let feedbackText = "";
        let speedText = "";

        // Проверка правильности
        if (transcript.includes(target.split(" ")[0])) {
            const wordCount = target.split(" ").length;
            const speed = duration / wordCount; // секунд на слово

            // 🔥 Новые, более строгие пороги
            if (speed <= 0.55) speedText = "<span class='speed-good'>Excellent speed!</span>";
            else if (speed <= 0.8) speedText = "<span class='speed-ok'>Okay, but could be faster.</span>";
            else speedText = "<span class='speed-bad'>Too slow — try again faster!</span>";

            feedbackText = `✅ Recognized: "${transcript}"<br>${speedText}`;
        } else {
            feedbackText = `❌ Didn't match. Try again.`;
        }

        document.getElementById("feedback").innerHTML = feedbackText;

        // История попыток
        if (!history[currentTwister]) history[currentTwister] = [];
        history[currentTwister].unshift(feedbackText);
        if (history[currentTwister].length > 5) history[currentTwister].pop();

        let histHTML = `<h3>Recent Attempts:</h3><ul>`;
        history[currentTwister].forEach(h => histHTML += `<li>${h}</li>`);
        histHTML += `</ul>`;
        document.getElementById("history").innerHTML = histHTML;
    };

    recognition.onerror = (e) => {
        document.getElementById("feedback").innerHTML = "⚠️ Error or no speech detected. Try again.";
    };
} else {
    startBtn.disabled = true;
    document.getElementById("feedback").textContent = "❌ Speech recognition not supported in this browser.";
}
</script>

</body>
</html>
