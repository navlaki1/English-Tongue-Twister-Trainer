<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎤 Tongue Twister Trainer</title>
<style>
body {
  font-family: "Segoe UI", sans-serif;
  background: #f2f4f8;
  color: #222;
  display: flex;
  justify-content: center;
  padding: 20px;
}
.container {
  background: #fff;
  width: 400px;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
h1 {
  font-size: 20px;
  text-align: center;
  color: #0a66c2;
  margin-bottom: 15px;
}
select, button {
  width: 100%;
  padding: 8px;
  margin: 6px 0;
  font-size: 14px;
  border-radius: 8px;
  border: 1px solid #ccc;
  outline: none;
  background: #fafafa;
  color: #0a66c2;
  font-weight: 600;
}
select:hover, button:hover { background: #eef4ff; }
button {
  background: #0a66c2;
  color: #fff;
  cursor: pointer;
  font-weight: 600;
}
button:active { background: #084a9d; }

#twister {
  margin: 12px 0;
  font-weight: 900;
  color: red;
  font-size: 22px;
  text-align: center;
}

#message {
  font-size: 14px;
  color: darkgreen;
  font-weight: bold;
  text-align: center;
  margin-bottom: 10px;
}

#recognizedText { 
  margin-top: 5px; 
  font-size: 14px; 
  color: #555; 
  font-style: italic; 
}

#history { 
  margin-top: 10px; 
  font-size: 14px; 
  color: #0a66c2; 
  text-align: left; 
}

.speed-select { margin: 6px 0; }
.button-row { display: flex; gap: 10px; margin-top: 5px; }
.button-row button { flex: 1; }
</style>
</head>
<body>

<div class="container">
<h1>🎤 English Tongue Twister Trainer</h1>

<label>1️⃣ Theme:</label>
<select id="themeSelect">
  <option value="">-- Select Theme --</option>
  <option value="animal">🐾 Animal</option>
  <option value="plant">🌿 Plant / Nature</option>
  <option value="food">🍎 Food</option>
  <option value="travel">🚗 Transport / Travel</option>
  <option value="people">🧍‍♂️ People / Daily Life</option>
  <option value="home">🏠 Home / Objects</option>
</select>

<label>2️⃣ Type:</label>
<select id="typeSelect">
  <option value="">-- Select Type --</option>
  <option value="consonant">Consonant Contrasts</option>
  <option value="vowel">Vowel Contrasts</option>
</select>

<label>3️⃣ Sounds:</label>
<select id="soundSelect">
  <option value="">-- Select Sounds --</option>
</select>

<p id="twister">—</p>
<p id="message">🎧 <b>Speak clearly and try to match the rhythm!</b></p>

<label>Listen Speed:</label>
<select id="speedSelect" class="speed-select">
  <option value="0.7">Slow</option>
  <option value="1.0" selected>Normal</option>
  <option value="1.3">Fast</option>
</select>

<div class="button-row">
  <button id="listenBtn">🔊 Listen</button>
  <button id="speakBtn">🎙️ Speak</button>
</div>

<p id="recognizedText">Recognized text will appear here</p>
<div id="history"></div>
</div>

<script>
const tongueTwisters = {
  animal: { consonant:{"/p/ vs /b/":"Big brown bears baked blueberry pies.","/s/ vs /ʃ/":"Six slippery snails slid slowly seaward.","/l/ vs /r/":"Little lions love running around rocky rivers.","/t/ vs /d/":"Tiny tigers don’t talk during dinner.","/f/ vs /v/":"Five furry foxes found very fine feathers."}, vowel:{"/iː/ vs /ɪ/":"Three sheep sleep in a ship.","/æ/ vs /ɛ/":"A fat cat sat and met a hen.","/uː/ vs /ʊ/":"A moose stood by the full pool."} },
  plant: { consonant:{"/p/ vs /b/":"Peter plants bright pink begonias.","/f/ vs /θ/":"Thick thorns and fine ferns.","/s/ vs /ʃ/":"Shiny seeds shimmer softly.","/m/ vs /n/":"Many new mosses need morning mist."}, vowel:{"/æ/ vs /ɑː/":"The black branch barked hard.","/eɪ/ vs /aɪ/":"Rain makes vines rise high.","/ɜː/ vs /ɔː/":"The fern by the thorn turned toward the dawn."} },
  food: { consonant:{"/p/ vs /b/":"Betty bought a bit of better butter.","/t/ vs /d/":"Tom tastes ten delicious donuts.","/f/ vs /v/":"Five fine fruits for very funny friends.","/k/ vs /g/":"Greedy goats gobbled green grapes."}, vowel:{"/iː/ vs /ɪ/":"Eat sweet peach pits quickly.","/æ/ vs /ʌ/":"A fat man must munch much jam.","/uː/ vs /ʊ/":"Cool cooks put soup in good bowls."} },
  travel: { consonant:{"/t/ vs /d/":"Ten tiny trains drove down the track.","/k/ vs /g/":"Quick cars go great distances.","/s/ vs /ʃ/":"She sells shiny ship sails.","/l/ vs /r/":"Ralph rolled along little lanes."}, vowel:{"/eɪ/ vs /aɪ/":"The plane flies high in the sky.","/ɪ/ vs /e/":"The ship set sail at six.","/ʌ/ vs /ɑː/":"The bus passed the large park."} },
  people: { consonant:{"/l/ vs /r/":"Larry rarely really likes red lilies.","/m/ vs /n/":"Many nice men made nine names.","/t/ vs /d/":"Tina told Dan to tidy the desk.","/f/ vs /v/":"Very few families find free food."}, vowel:{"/ɪ/ vs /iː/":"Sit and see the city’s sheep.","/æ/ vs /ɛ/":"That bad man met ten men.","/aɪ/ vs /aʊ/":"I like loud, bright lights."} },
  home: { consonant:{"/p/ vs /b/":"Polly bought pretty blue plates.","/t/ vs /k/":"Tim took two clean cups.","/s/ vs /ʃ/":"She stacks six shiny spoons.","/n/ vs /l/":"Nina lent nine little lamps."}, vowel:{"/ɪ/ vs /e/":"Fill every bin with red pens.","/eɪ/ vs /aɪ/":"Kate’s white tile shines bright.","/uː/ vs /ʊ/":"Luke looked for the blue book."} }
};

let currentTheme="", currentType="", currentPair="", currentTwister="";
let listenSpeed=1.0, historyData={};

const themeSelect=document.getElementById("themeSelect");
const typeSelect=document.getElementById("typeSelect");
const soundSelect=document.getElementById("soundSelect");
const speedSelect=document.getElementById("speedSelect");

function resetAll(){
  document.getElementById("twister").textContent="—";
  document.getElementById("history").innerHTML="";
  document.getElementById("recognizedText").textContent="Recognized text will appear here";
  historyData={};
}

themeSelect.addEventListener("change",(e)=>{ currentTheme=e.target.value; resetAll(); updateSounds(); });
typeSelect.addEventListener("change",(e)=>{ currentType=e.target.value; resetAll(); updateSounds(); });

function updateSounds(){
  soundSelect.innerHTML='<option value="">-- Select Sounds --</option>';
  if(currentTheme && currentType){
    Object.keys(tongueTwisters[currentTheme][currentType]).forEach(pair=>{
      let opt=document.createElement("option");
      opt.value=pair; opt.textContent=pair;
      soundSelect.appendChild(opt);
    });
  }
}

soundSelect.addEventListener("change",()=>{
  currentPair=soundSelect.value;
  if(currentPair){
    currentTwister=tongueTwisters[currentTheme][currentType][currentPair];
    document.getElementById("twister").textContent=currentTwister;
    document.getElementById("history").innerHTML="";
    document.getElementById("recognizedText").textContent="Recognized text will appear here";
    historyData={};
  }
});

speedSelect.addEventListener("change",()=>{ listenSpeed=parseFloat(speedSelect.value); });

document.getElementById("listenBtn").addEventListener("click",()=>{
  if(!currentTwister) return alert("Select a twister first!");
  let utter=new SpeechSynthesisUtterance(currentTwister);
  utter.rate=listenSpeed; utter.lang="en-US";
  speechSynthesis.speak(utter);
});

if('webkitSpeechRecognition' in window){
  const recognition=new webkitSpeechRecognition();
  recognition.lang="en-US"; recognition.continuous=false; recognition.interimResults=false;
  let startTime;

  document.getElementById("speakBtn").onclick=()=>{
    if(!currentTwister) return alert("Select a twister first!");
    recognition.start(); startTime=new Date().getTime();
  };

  recognition.onresult=(event)=>{
    const duration=(new Date().getTime()-startTime)/1000;
    const transcript=event.results[0][0].transcript;

    // Показываем распознанный текст
    document.getElementById("recognizedText").textContent="Recognized: " + transcript;

    const target=currentTwister.toLowerCase();
    const spoken=transcript.toLowerCase();

    function similarity(a,b){
      let longer=a.length>b.length?a:b;
      let shorter=a.length>b.length?b:a;
      if(longer.length===0) return 1.0;
      let edits=levenshtein(longer,shorter);
      return (longer.length-edits)/longer.length;
    }

    function levenshtein(a,b){
      const matrix=[];
      for(let i=0;i<=b.length;i++) matrix[i]=[i];
      for(let j=0;j<=a.length;j++) matrix[0][j]=j;
      for(let i=1;i<=b.length;i++){
        for(let j=1;j<=a.length;j++){
          matrix[i][j]=b[i-1]===a[j-1]?matrix[i-1][j-1]:Math.min(matrix[i-1][j-1]+1,matrix[i][j-1]+1,matrix[i-1][j]+1);
        }
      }
      return matrix[b.length][a.length];
    }

    const acc=(similarity(target,spoken)*100).toFixed(1);

    // Оценка скорости всегда по нормальной скорости
    let expectedTime=target.split(" ").length*0.6; 
    let speedLabel="";
    if(duration<=expectedTime*0.7) speedLabel="🚀 Very fast!";
    else if(duration<=expectedTime*1.0) speedLabel="🏃 Fast";
    else if(duration<=expectedTime*1.4) speedLabel="🚶 Slow";
    else speedLabel="🐢 Very slow";

    if(!historyData[currentTwister]) historyData[currentTwister]=[];
    historyData[currentTwister].push({acc,speedLabel});
    if(historyData[currentTwister].length>5) historyData[currentTwister].shift();

    let histHTML="<h3>Recent Attempts:</h3><ol>";
    historyData[currentTwister].forEach((h,i)=>{
      histHTML+=`<li>Accuracy: ${h.acc}% | Speed: ${h.speedLabel}</li>`;
    });
    histHTML+="</ol>";
    document.getElementById("history").innerHTML=histHTML;
  };

  recognition.onerror=(e)=>{
    document.getElementById("recognizedText").textContent="⚠️ Error or no speech detected. Try again.";
  };
}else{
  document.getElementById("speakBtn").disabled=true;
  document.getElementById("history").innerHTML="❌ Speech recognition not supported in this browser.";
}
</script>

</body>
</html>
