<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tongue Twister Trainer</title>
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f8fdf8;
    color: #333;
    text-align: center;
    margin: 20px;
}
h1 { color: #2a6b2a; }
select, button {
    margin: 6px;
    padding: 8px 12px;
    font-size: 16px;
}
#twister {
    font-size: 22px;
    margin: 20px 0;
    font-weight: bold;
    color: #1b4d1b;
}
#message {
    color: darkgreen;
    font-weight: bold;
    font-size: 20px;
}
#feedback { font-size: 18px; margin: 15px; }
#history { margin-top: 20px; font-size: 16px; color: #555; text-align: left; display: inline-block; }
.speed-good { color: green; font-weight: bold; }
.speed-ok { color: orange; font-weight: bold; }
.speed-bad { color: red; font-weight: bold; }
button { cursor: pointer; }
.speed-btn { margin: 4px; }
</style>
</head>
<body>

<h1>🎙️ English Tongue Twister Trainer</h1>

<div>
    <label>Theme:</label>
    <select id="themeSelect">
        <option value="">-- Select Theme --</option>
        <option value="food">🍎 Food</option>
        <option value="travel">🚗 Transport / Travel</option>
        <option value="people">🧍‍♂️ People / Daily Life</option>
        <option value="home">🏠 Home / Objects</option>
    </select>

    <label>Type:</label>
    <select id="typeSelect">
        <option value="">-- Select Type --</option>
        <option value="consonant">Consonant Contrasts</option>
        <option value="vowel">Vowel Contrasts</option>
    </select>
</div>

<p id="twister">Select theme and type to start!</p>
<p id="message">🎧 <b>Speak clearly and try to match the rhythm!</b></p>

<div>
    <label>Listen Speed:</label>
    <button class="speed-btn" data-speed="0.7">Slow</button>
    <button class="speed-btn" data-speed="1.0">Normal</button>
    <button class="speed-btn" data-speed="1.3">Fast</button>
</div>

<button id="listenBtn">🔊 Listen</button>
<button id="speakBtn">🎤 Speak</button>
<button id="nextBtn">➡️ Next</button>

<p id="feedback"></p>
<div id="history"></div>

<script>
const tongueTwisters = {
    food: { consonant: ["Betty bought a bit of better butter.","Tom tastes ten delicious donuts.","Five fine fruits for very funny friends.","Greedy goats gobbled green grapes."],
            vowel: ["Eat sweet peach pits quickly.","A fat man must munch much jam.","Cool cooks put soup in good bowls."] },
    travel: { consonant: ["Ten tiny trains drove down the track.","Quick cars go great distances.","She sells shiny ship sails.","Ralph rolled along little lanes."],
              vowel: ["The plane flies high in the sky.","The ship set sail at six.","The bus passed the large park."] },
    people: { consonant: ["Larry rarely really likes red lilies.","Many nice men made nine names.","Tina told Dan to tidy the desk.","Very few families find free food."],
              vowel: ["Sit and see the city’s sheep.","That bad man met ten men.","I like loud, bright lights."] },
    home: { consonant: ["Polly bought pretty blue plates.","Tim took two clean cups.","She stacks six shiny spoons.","Nina lent nine little lamps."],
            vowel: ["Fill every bin with red pens.","Kate’s white tile shines bright.","Luke looked for the blue book."] }
};

let currentTheme = "", currentType = "", currentTwister = "";
let startTime, listenSpeed = 1.0;
let historyData = {};

function getRandomTwister() {
    const list = tongueTwisters[currentTheme][currentType];
    return list[Math.floor(Math.random()*list.length)];
}

document.getElementById("themeSelect").addEventListener("change", (e)=>{
    currentTheme = e.target.value;
    document.getElementById("twister").textContent = "Select type to start!";
    document.getElementById("feedback").textContent = "";
    document.getElementById("history").innerHTML = "";
    historyData = {};
});

document.getElementById("typeSelect").addEventListener("change", (e)=>{
    currentType = e.target.value;
    if(currentTheme && currentType){
        currentTwister = getRandomTwister();
        document.getElementById("twister").textContent = currentTwister;
        document.getElementById("feedback").textContent = "";
        document.getElementById("history").innerHTML = "";
        historyData = {};
    }
});

document.getElementById("nextBtn").addEventListener("click", ()=>{
    if(!currentTheme || !currentType) return;
    currentTwister = getRandomTwister();
    document.getElementById("twister").textContent = currentTwister;
    document.getElementById("feedback").textContent = "";
});

document.querySelectorAll(".speed-btn").forEach(btn=>{
    btn.addEventListener("click",(e)=>{
        listenSpeed = parseFloat(e.target.dataset.speed);
    });
});

document.getElementById("listenBtn").addEventListener("click", ()=>{
    if(!currentTwister) return alert("Select a twister first!");
    const utter = new SpeechSynthesisUtterance(currentTwister);
    utter.rate = listenSpeed;
    utter.lang = "en-US";
    speechSynthesis.speak(utter);
});

// === Speech Recognition ===
if('webkitSpeechRecognition' in window){
    const recognition = new webkitSpeechRecognition();
    recognition.lang="en-US";
    recognition.continuous=false;
    recognition.interimResults=false;

    document.getElementById("speakBtn").onclick=()=>{
        if(!currentTwister) return alert("Select a twister first!");
        recognition.start();
        startTime = new Date().getTime();
        document.getElementById("feedback").textContent = "🎧 Listening...";
    };

    recognition.onresult=(event)=>{
        const endTime = new Date().getTime();
        const duration = (endTime-startTime)/1000; 
        const transcript = event.results[0][0].transcript.toLowerCase();
        const target = currentTwister.toLowerCase();

        // скорость на слово
        const words = target.split(" ").length;
        const speedPerWord = duration/words;
        let speedEval = "";
        // градация по выбранной скорости
        const thresholds = { slow: [0.65,0.85,1.1], normal: [0.5,0.7,0.9], fast: [0.35,0.5,0.7] };
        let key="";
        if(listenSpeed<=0.8) key="slow";
        else if(listenSpeed<=1.1) key="normal";
        else key="fast";

        if(speedPerWord<=thresholds[key][0]) speedEval = "<span class='speed-good'>🏆 Excellent!</span>";
        else if(speedPerWord<=thresholds[key][1]) speedEval = "<span class='speed-ok'>👍 Good</span>";
        else if(speedPerWord<=thresholds[key][2]) speedEval = "<span class='speed-ok'>👌 Okay</span>";
        else speedEval = "<span class='speed-bad'>🐢 Too slow</span>";

        let feedbackText="";
        if(transcript.includes(target.split(" ")[0])){
            feedbackText = `✅ Recognized: "${transcript}"<br>${speedEval}`;
        }else{
            feedbackText = `❌ Didn't match. Try again.`;
        }

        document.getElementById("feedback").innerHTML = feedbackText;

        // история
        if(!historyData[currentTwister]) historyData[currentTwister]=[];
        historyData[currentTwister].unshift(feedbackText);
        if(historyData[currentTwister].length>5) historyData[currentTwister].pop();

        let histHTML="<h3>Recent Attempts:</h3><ul>";
        historyData[currentTwister].forEach(h=>histHTML+=`<li>${h}</li>`);
        histHTML+="</ul>";
        document.getElementById("history").innerHTML=histHTML;
    };

    recognition.onerror=(e)=>{
        document.getElementById("feedback").textContent="⚠️ Error or no speech detected. Try again.";
    };
}else{
    document.getElementById("speakBtn").disabled=true;
    document.getElementById("feedback").textContent="❌ Speech recognition not supported in this browser.";
}
</script>

</body>
</html>
